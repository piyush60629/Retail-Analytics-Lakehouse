name: Tests

on:
  push:
  pull_request:

jobs:
  monitoring-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tools
        run: pip install pytest
      - name: Run offline tests (no Spark needed)
        run: python -m pytest -q tests
